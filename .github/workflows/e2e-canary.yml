name: E2E canary

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: Optional GitHub pull request files URL to exercise the diff adapter
        required: false
        type: string

concurrency:
  group: e2e-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Test against live GitHub
        run: npm run e2e
        env:
          GUTTERHUB_E2E_PR: ${{ inputs.pull_request_url }}

  report:
    needs: canary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update canary issue
        uses: actions/github-script@v8
        env:
          CANARY_RESULT: ${{ needs.canary.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const result = process.env.CANARY_RESULT;
            if (result === "cancelled" || result === "skipped") {
              return;
            }

            const title = "E2E canary: GitHub markup compatibility failure";
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const issue = issues.find(
              (candidate) => !candidate.pull_request && candidate.title === title,
            );
            const timestamp = new Date().toISOString();

            if (result === "failure") {
              const body = [
                "The scheduled browser-extension canary failed against live github.com.",
                "",
                `- Failed run: ${process.env.RUN_URL}`,
                `- Commit: ${context.sha}`,
                `- Observed: ${timestamp}`,
                "",
                "This can indicate that GitHub changed its markup. It can also be a transient",
                "live-site or browser failure, so inspect the run before changing selectors.",
              ].join("\n");

              if (issue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "open",
                  body,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              return;
            }

            if (issue?.state === "open") {
              const body = [
                issue.body ?? "",
                "",
                `Recovered in ${process.env.RUN_URL} at ${timestamp}.`,
              ].join("\n");
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
                body,
              });
            }
