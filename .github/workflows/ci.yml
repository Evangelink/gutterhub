name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated icons are up to date
        run: |
          node scripts/generate-icons.mjs
          git diff --exit-code -- assets

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: gutterhub-unpacked
          path: dist/
