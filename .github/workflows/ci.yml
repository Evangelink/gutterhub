name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        shell: bash
        run: |
          mkdir -p artifacts
          npm run coverage 2>&1 | tee artifacts/coverage-summary.txt
          {
            echo "## Coverage"
            echo '```text'
            tail -n 8 artifacts/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NO_COLOR: 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: gutterhub-coverage
          path: artifacts/coverage/

      - name: Build
        run: npm run build

      - name: Verify generated icons are up to date
        run: |
          node scripts/generate-icons.mjs
          git diff --exit-code -- assets

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: gutterhub-unpacked
          path: dist/

  windows-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test Windows path handling
        run: npm test

  # The deterministic half of the end-to-end suite. It serves saved GitHub markup and
  # blocks all real network, so unlike the scheduled canary it is safe to gate pull
  # requests on: it cannot fail because github.com is slow, down, or has been restyled.
  e2e-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Even on a cache hit the OS-level libraries are not cached, so install those.
      - name: Install browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end (offline)
        run: npm run e2e:offline

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: artifacts/playwright-report/
          retention-days: 7
